name: Pages
# One GitHub Pages site, two builds:
#   /breaking_town/      — the beta for testers, built from the commit in .github/beta-commit (frozen);
#   /breaking_town/dev/  — the latest master, for watching changes.
# A new beta = put a new commit hash into .github/beta-commit and push.
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: beta
        run: echo "sha=$(tr -d '[:space:]' < .github/beta-commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.beta.outputs.sha }}
          path: beta-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the dev preview
        run: |
          npm run build -- --base=/${{ github.event.repository.name }}/dev/
          mkdir -p site && mv dist site/dev
      - name: Build the beta
        working-directory: beta-src
        run: |
          npm ci
          npm run build -- --base=/${{ github.event.repository.name }}/
          cp -r dist/. ../site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
